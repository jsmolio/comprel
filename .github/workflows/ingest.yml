name: Scheduled ingest

# Publishes compact event facts and a display snapshot into this repo.
# The site reads that snapshot. This job does not connect to Postgres.
#
# The workflow stays disabled in the GitHub UI until someone turns it back
# on after the first reviewed snapshot is on main. Editing this file does not
# re-enable a workflow that was disabled manually. Do not dispatch it as part
# of opening this change.
#
# A non-zero backfill exit skips every later step, including the commit.
# GitHub Actions runs a step only when the previous step succeeded, and this
# job does not override that. MTGO structural failure and any missed cache
# file exit 1 before the snapshot is renamed, so a failed run cannot push a
# partial refresh. There is no exit-2 path that commits first and fails after.
#
# Token and deploy behavior:
# - `permissions: contents: write` lets the default GITHUB_TOKEN push to this
#   repo. Org or repo settings that cap token permissions at read will make
#   the push fail. A fine-grained PAT is not configured here.
# - GitHub documents that events caused by GITHUB_TOKEN do not create a new
#   workflow run, except workflow_dispatch, repository_dispatch, and a few
#   pull_request activities. A push from this job does not retrigger itself.
#   The same page says those commits do not trigger a GitHub Pages build.
#   https://docs.github.com/en/actions/concepts/security/github_token
# - Vercel is not GitHub Pages. It deploys from its own GitHub App on pushes
#   to the production branch. A push to main from this job, once the workflow
#   is enabled and Vercel is still connected, is a production deployment.
#   Preview deployments follow pushes to other branches. Branch protection
#   that rejects the bot stops the push instead of deploying.

on:
  schedule:
    - cron: "0 */2 * * *" # every 2 hours (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: comprel-ingest
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Incremental publish
        run: pnpm backfill --incremental
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit published data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/facts data/published
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Publish metagame snapshot"
          git push

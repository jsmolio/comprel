name: Scheduled ingest

# Publishes compact event facts and a display snapshot into this repo.
# The site reads that snapshot. This job does not connect to Postgres.
#
# The workflow stays disabled in the GitHub UI until someone turns it back
# on after the first reviewed snapshot is on main. Editing this file does not
# re-enable a workflow that was disabled manually. Do not dispatch it as part
# of opening this change.
#
# Magic and Riftbound publish independently. A structural failure in one game
# restores that game's working tree and does not block the other game's commit.
# There is no exit-2 path. The cron schedule is unchanged. Do not dispatch this
# workflow as part of opening a change.
#
# Each game writes a miss summary under RUNNER_TEMP. The diagnostics step copies
# those files into the job summary and records a failed game step. The site does
# not show ingest misses. That step stays before the commit so a double failure
# still leaves the summary.
#
# Token and deploy behavior:
# - `permissions: contents: write` lets the default GITHUB_TOKEN push to this
#   repo. Org or repo settings that cap token permissions at read will make
#   the push fail. A fine-grained PAT is not configured here.
# - GitHub documents that events caused by GITHUB_TOKEN do not create a new
#   workflow run, except workflow_dispatch, repository_dispatch, and a few
#   pull_request activities. A push from this job does not retrigger itself.
#   The same page says those commits do not trigger a GitHub Pages build.
#   https://docs.github.com/en/actions/concepts/security/github_token
# - Vercel is not GitHub Pages. It deploys from its own GitHub App on pushes
#   to the production branch. A push to main from this job, once the workflow
#   is enabled and Vercel is still connected, is a production deployment.
#   Preview deployments follow pushes to other branches. Branch protection
#   that rejects the bot stops the push instead of deploying.

on:
  schedule:
    - cron: "0 */2 * * *" # every 2 hours (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: comprel-ingest
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Incremental Magic publish
        id: magic
        run: pnpm backfill --incremental
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Empty when the Actions secret is not set. Backfill then keeps the
          # saved video list and does not fail the tournament publish.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Discard partial Magic data
        if: steps.magic.outcome == 'failure'
        run: |
          git checkout -- data/facts/v1 data/published/snapshot.json || true
          git clean -fd -- data/facts/v1 || true
      - name: Incremental Riftbound publish
        id: riftbound
        run: pnpm backfill --incremental --game=riftbound
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Discard partial Riftbound data
        if: steps.riftbound.outcome == 'failure'
        run: |
          git checkout -- data/facts/riftbound data/published/riftbound || true
          git clean -fd -- data/facts/riftbound data/published/riftbound || true
      - name: Record ingest diagnostics
        run: |
          {
            echo "## Ingest step outcomes"
            echo
            echo "- Magic: ${{ steps.magic.outcome }}"
            echo "- Riftbound: ${{ steps.riftbound.outcome }}"
            if [ "${{ steps.magic.outcome }}" != "success" ]; then
              echo
              echo "Magic publish failed (continue-on-error). Partial Magic data was discarded. Misses recorded by that step follow when a summary file exists."
            fi
            if [ "${{ steps.riftbound.outcome }}" != "success" ]; then
              echo
              echo "Riftbound publish failed (continue-on-error). Partial Riftbound data was discarded. Misses recorded by that step follow when a summary file exists."
            fi
            echo
            for game in magic riftbound; do
              file="$RUNNER_TEMP/comprel-ingest-${game}.md"
              if [ -f "$file" ]; then
                cat "$file"
                echo
              else
                echo "No ${game} miss summary file was written."
                echo
              fi
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit published data
        run: |
          magic="${{ steps.magic.outcome }}"
          rift="${{ steps.riftbound.outcome }}"
          if [ "$magic" != "success" ] && [ "$rift" != "success" ]; then
            echo "Both game publishes failed; nothing committed."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/facts data/published
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Publish metagame snapshot"
          git push
